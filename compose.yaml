name: enterprise-private-gpt

x-python: &python
  image: enterprise-private-gpt-python:local
  init: true
  restart: unless-stopped

services:
  app:
    <<: *python
    build: .
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    dns: ["127.0.0.1"]
    environment:
      HOME: /tmp
    command:
      - sh
      - -ec
      - |
        if [ -n "$$(ip -4 route show default)" ]; then
          ip -4 route del default
        fi
        test -z "$$(ip -4 route show default)"
        exec setpriv --reuid=10001 --regid=10001 --clear-groups --no-new-privs \
          --inh-caps=-all --ambient-caps=-all --bounding-set=-all python app.py
    ports:
      - "127.0.0.1:7860:7860"
    networks:
      - default
      - browser
    depends_on:
      - ingest
      - ollama
      - qdrant

  ingest:
    <<: *python
    command: ["uvicorn", "ingest:api", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data/demo:/documents:ro
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ollama_models:/root/.ollama

networks:
  default:
    internal: true
  browser:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  qdrant_data:
  ollama_models:
